<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        Sabir's Giga Pet
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
         <!-- Replace pet image with your own pet image -->
        <img class="pet-image" src="images/lilbambino.png" alt="Lil Bambino">
      </section>
      <section class="dashboard">
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> squeaking (per min)</strong></div>
        <p class="warning"></p>

        <!-- so basically, this is the random-dialogue class, these are the 5 options, 
         if i added more they'd be rnged from script.js for that entire function
         everytime you click, it'll randomly pick one, it might pick the same thing, but it'll display all of them eventually after enough clicks.-->
        <div class="random-dialogue" hidden>
          <span>'Hello there..'</span>
          <span>'I'm Lil Bambino'</span>
          <span>'ARGHHHHHHHHH!'</span>
          <span>'Hm.'</span>
          <span>'Stop pressing that button.'</span>
        </div>

        <p class="talkoption" aria-live="polite"></p>

        <div class="button-container">
          <button class="feed-button">
            Feed
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <button class="talk-button">
            Talk
          </button>
        </div>
      </section>
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
